name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recherche/modeles/requirements-dev.txt

      - name: Installer les dependances
        run: pip install -r recherche/modeles/requirements-dev.txt

      - name: Compiler
        run: python -m compileall -q recherche/modeles tests

      - name: Tester
        run: pytest
