name: Recherche - Relance manuelle (positionnement COT)

# ETAGE HEBDOMADAIRE, sorti de l'ingestion lente le 2026-09-14 pour corriger un BUG DE TIMING
# reel, pas une preference de style.
#
# Le rapport Commitments of Traders de la CFTC parait le VENDREDI vers 15h30 heure de New York,
# soit environ 20h30 UTC. L'ingestion lente tourne a 06h00 UTC. La donnee de positionnement du
# vendredi n'etait donc ramassee que le lundi matin suivant : environ deux jours et demi de
# retard, chaque semaine, sur la donnee de positionnement la plus fraiche du dispositif.
#
# Cette relance ciblee n'est pas planifiee. L'ingestion CFTC fait partie de la mise a jour
# complete horaire ; avant la publication hebdomadaire, elle reecrit simplement le meme fichier.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recherche-push
  cancel-in-progress: false

jobs:
  cot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recherche/modeles/requirements.txt

      - name: Installer les dependances
        run: pip install -r recherche/modeles/requirements.txt

      - name: Ingestion CFTC (positionnement, 32 contrats)
        if: always()
        run: python recherche/modeles/ingestion_cftc.py

      - name: Commit et push si changement
        if: always()
        run: |
          git config user.name "research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/brut
          if git diff --cached --quiet; then
            echo "Aucun changement -- rien a committer."
          else
            git commit -m "Ingestion COT - $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
