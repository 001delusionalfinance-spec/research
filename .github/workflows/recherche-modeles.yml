name: Recherche - Mise a jour complete horaire

on:
  schedule:
    # Une seule chaine ordonnee : toutes les sources, tous les modeles, puis les rapports.
    # GitHub Actions utilise UTC et peut decaler legerement le depart des crons.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Une seule execution horaire peut ecrire a la fois. Les workflows d'ingestion specialises
# restent disponibles en relance manuelle et partagent ce verrou.
concurrency:
  group: recherche-push
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recherche/modeles/requirements-dev.txt

      - name: Installer les dependances
        run: pip install -r recherche/modeles/requirements-dev.txt

      - name: Tests reproductibles
        run: pytest

      # Toutes les ingestions precedent le calcul : la fraicheur arrive donc jusqu'aux rapports
      # dans la meme execution, sans course entre plusieurs workflows planifies.
      - name: Ingestion marches (FX, matieres premieres, vol, indices non-US)
        if: always()
        run: python recherche/modeles/ingestion_marches.py

      - name: Ingestion yfinance (S&P 500, VIX, secteurs)
        if: always()
        run: python recherche/modeles/ingestion_yfinance_indices.py

      - name: Ingestion CFTC (positionnement, 32 contrats)
        if: always()
        run: python recherche/modeles/ingestion_cftc.py

      - name: Ingestion FRED
        if: always()
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python recherche/modeles/ingestion_fred.py

      - name: Ingestion BIS (prix a la consommation)
        if: always()
        run: python recherche/modeles/ingestion_bis_cpi.py

      - name: Ingestion BIS (taux directeurs et service de la dette)
        if: always()
        run: python recherche/modeles/ingestion_bis_macro.py

      - name: Ingestion souverains quotidiens (BCE, BoE, Japon)
        if: always()
        run: python recherche/modeles/ingestion_souverains_quotidiens.py

      - name: Ingestion souverains G10 (Canada, Australie, Suede)
        if: always()
        run: python recherche/modeles/ingestion_souverains_g10.py

      - name: Ingestion bilans nationaux
        if: always()
        run: python recherche/modeles/ingestion_bilans_nationaux.py

      - name: Ingestion Tresor US
        if: always()
        run: python recherche/modeles/ingestion_tresor_us.py

      - name: Ingestion Eurostat
        if: always()
        run: python recherche/modeles/ingestion_eurostat.py

      - name: Ingestion communiques FOMC
        if: always()
        run: python recherche/modeles/ingestion_fomc_statements.py

      - name: Ingestion calendrier FOMC
        if: always()
        run: python recherche/modeles/ingestion_fomc_calendrier.py

      - name: Ingestion minutes FOMC
        if: always()
        run: python recherche/modeles/ingestion_fomc_minutes.py

      - name: Ingestion declarations BCE
        if: always()
        run: python recherche/modeles/ingestion_bce_declarations.py

      - name: Ingestion resumes BoE
        if: always()
        run: python recherche/modeles/ingestion_boe_declarations.py

      - name: Calculer tous les modeles
        if: always()
        run: python recherche/modeles/run_all_modeles.py

      - name: Controle de fraicheur des sources
        if: always()
        run: python recherche/modeles/controle_fraicheur.py

      # Les trois sorties ci-dessous tournent meme si un modele a echoue : le reste du
      # dispositif a produit des resultats exploitables, et une page de lecture partielle vaut
      # mieux que pas de page du tout.
      - name: Controle des ruptures de perimetre
        if: always()
        run: python recherche/modeles/controle_ruptures.py

      - name: Controle de coherence -- taux Fed (warning si source retardee)
        if: always()
        run: python recherche/modeles/controle_coherence_fed.py

      - name: Generer les graphiques utiles
        if: always()
        run: python recherche/modeles/generer_visualisations.py

      - name: Publier le centre de recherche thematique
        if: always()
        run: python recherche/modeles/publier_rapports.py

      - name: Exporter le classeur Excel
        if: always()
        run: python recherche/modeles/export_excel.py

      - name: Inventaire du dispositif
        if: always()
        run: python recherche/modeles/inventaire.py

      - name: Commit et push si changement
        if: always()
        run: |
          git config user.name "research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/brut rapports
          if git diff --cached --quiet; then
            echo "Aucun changement -- rien a committer."
          else
            git commit -m "Recherche - mise a jour complete $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
