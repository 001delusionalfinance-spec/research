name: Recherche - Modeles

on:
  schedule:
    - cron: "30 6 * * 1-5"  # 30 min apres l'ingestion, meme jour ouvre
  workflow_dispatch:

permissions:
  contents: write

# Meme groupe que les trois workflows d'ingestion : tout ce qui pousse sur
# `main` est serialise, sinon deux executions se marchent dessus au rebase.
concurrency:
  group: recherche-push
  cancel-in-progress: false

jobs:
  modeles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recherche/modeles/requirements.txt

      - name: Installer les dependances
        run: pip install -r recherche/modeles/requirements.txt

      - name: Calculer tous les modeles
        run: python recherche/modeles/run_all_modeles.py

      # Les trois sorties ci-dessous tournent meme si un modele a echoue : le reste du
      # dispositif a produit des resultats exploitables, et une page de lecture partielle vaut
      # mieux que pas de page du tout.
      - name: Generer les apercus graphiques
        if: always()
        run: python recherche/modeles/generer_visualisations.py

      - name: Exporter le classeur Excel
        if: always()
        run: python recherche/modeles/export_excel.py

      - name: Commit et push si changement
        if: always()
        run: |
          git config user.name "research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add recherche/etat recherche/visualisations rapports
          if git diff --cached --quiet; then
            echo "Aucun changement -- rien a committer."
          else
            git commit -m "Modeles recherche - $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
