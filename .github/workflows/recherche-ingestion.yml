name: Recherche - Ingestion

on:
  schedule:
    - cron: "0 6 * * 1-5"  # une fois par jour ouvre -- toutes les series ici sont macro
                            # (taux directeurs, chomage), aucune ne bouge assez vite pour
                            # justifier plusieurs passages par jour comme dans GMDC (FX/futures)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r recherche/modeles/requirements.txt

      - name: Ingestion FRED (API officielle)
        if: always()
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python recherche/modeles/ingestion_fred.py

      - name: Ingestion CFTC (positionnement)
        if: always()
        run: python recherche/modeles/ingestion_cftc.py

      - name: Ingestion yfinance - indices (S&P 500, VIX)
        if: always()
        run: python recherche/modeles/ingestion_yfinance_indices.py

      - name: Ingestion marches (FX, matieres premieres, vol, indices non-US)
        if: always()
        run: python recherche/modeles/ingestion_marches.py

      - name: Ingestion BIS (prix a la consommation, 12 blocs)
        if: always()
        run: python recherche/modeles/ingestion_bis_cpi.py

      - name: Ingestion BIS (taux directeurs quotidiens, service de la dette)
        if: always()
        run: python recherche/modeles/ingestion_bis_macro.py

      - name: Ingestion souverains quotidiens (BCE, BoE, MOF Japon)
        if: always()
        run: python recherche/modeles/ingestion_souverains_quotidiens.py

      - name: Ingestion communiques FOMC
        if: always()
        run: python recherche/modeles/ingestion_fomc_statements.py

      - name: Ingestion declarations de politique monetaire BCE
        if: always()
        run: python recherche/modeles/ingestion_bce_declarations.py

      - name: Ingestion minutes FOMC
        if: always()
        run: python recherche/modeles/ingestion_fomc_minutes.py

      - name: Commit et push si changement
        if: always()
        run: |
          git config user.name "research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/brut
          if git diff --cached --quiet; then
            echo "Aucun changement -- rien a committer."
          else
            git commit -m "Ingestion recherche - $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
