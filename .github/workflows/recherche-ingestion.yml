name: Recherche - Relance manuelle (sources macro)

# ETAGE LENT. Sources macro officielles et textes de banques centrales : taux directeurs,
# prix, activite, courbes souveraines, budgetaire, bilans, communiques.
# Cette relance ciblee n'est pas planifiee. Toutes ces sources sont verifiees dans la mise a
# jour complete horaire ; une source mensuelle ou trimestrielle reste naturellement inchangee
# tant que son producteur n'a rien publie de nouveau.

on:
  workflow_dispatch:

permissions:
  contents: write

# Le verrou est partage avec la chaine horaire pour proteger les rares relances manuelles.
concurrency:
  group: recherche-push
  cancel-in-progress: false

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recherche/modeles/requirements.txt

      - name: Installer les dependances
        run: pip install -r recherche/modeles/requirements.txt

      - name: Ingestion FRED (API officielle)
        if: always()
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python recherche/modeles/ingestion_fred.py

      - name: Ingestion BIS (prix a la consommation, 12 blocs)
        if: always()
        run: python recherche/modeles/ingestion_bis_cpi.py

      - name: Ingestion BIS (taux directeurs quotidiens, service de la dette)
        if: always()
        run: python recherche/modeles/ingestion_bis_macro.py

      - name: Ingestion souverains quotidiens (BCE, BoE, MOF Japon)
        if: always()
        run: python recherche/modeles/ingestion_souverains_quotidiens.py

      - name: Ingestion souverains G10 (Canada, Australie, Suede)
        if: always()
        run: python recherche/modeles/ingestion_souverains_g10.py

      - name: Ingestion bilans nationaux (BoE, RBA, BoC, avoirs BCE)
        if: always()
        run: python recherche/modeles/ingestion_bilans_nationaux.py

      - name: Ingestion Tresor US (emission, dette, tresorerie)
        if: always()
        run: python recherche/modeles/ingestion_tresor_us.py

      - name: Ingestion Eurostat (activite, enquetes, budgetaire)
        if: always()
        run: python recherche/modeles/ingestion_eurostat.py

      - name: Ingestion communiques FOMC
        if: always()
        run: python recherche/modeles/ingestion_fomc_statements.py

      - name: Ingestion calendrier FOMC (reunions a venir)
        if: always()
        run: python recherche/modeles/ingestion_fomc_calendrier.py

      - name: Ingestion minutes FOMC
        if: always()
        run: python recherche/modeles/ingestion_fomc_minutes.py

      - name: Ingestion declarations de politique monetaire BCE
        if: always()
        run: python recherche/modeles/ingestion_bce_declarations.py

      - name: Ingestion resumes de politique monetaire BoE
        if: always()
        run: python recherche/modeles/ingestion_boe_declarations.py

      - name: Controle de fraicheur des donnees
        if: always()
        run: python recherche/modeles/controle_fraicheur.py

      - name: Commit et push si changement
        if: always()
        run: |
          git config user.name "research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/brut rapports/donnees/fraicheur.csv
          if git diff --cached --quiet; then
            echo "Aucun changement -- rien a committer."
          else
            git commit -m "Ingestion lente - $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
