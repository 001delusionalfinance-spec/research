name: Recherche - Fed (horaire)

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recherche-push
  cancel-in-progress: false

jobs:
  fed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recherche/modeles/requirements-dev.txt

      - name: Installer les dependances
        run: pip install -r recherche/modeles/requirements-dev.txt

      - name: Tests reproductibles
        run: pytest

      - name: Recalculer la vue Fed
        run: python recherche/modeles/run_fed.py

      - name: Commit et push si une donnee a change
        run: |
          git config user.name "research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add recherche/etat rapports/fed
          if git diff --cached --quiet; then
            echo "Aucun changement de donnee -- rien a committer."
          else
            git commit -m "Fed - actualisation $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
